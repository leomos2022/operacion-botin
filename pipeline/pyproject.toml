[project]
name = "operacion-botin-pipeline"
version = "0.1.0"
description = "Pipeline de extracción, features y RAG para Operación Botín"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
rag = [
    "openai>=1.60.0",
    "qdrant-client>=1.12.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "SIM", "TID"]
ignore = ["E501"]  # longitud de línea la gestiona el formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
packages = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
